    <title>Faultline Lab</title>
    <style>:root{--lightningcss-light:initial;--lightningcss-dark: ;color-scheme:light;--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--border:#0b0b0b1a;--s1:#2a78d6;--s2:#eb6834;--mid:#f0efec;--pole-a:#1c5cab;--pole-b:#c9302f;--seq-lo:#e6f0fc;--seq-hi:#0d366b;--good:#0ca30c;--warning:#fab219;--critical:#d03b3b}@media (prefers-color-scheme:dark){:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--border:#ffffff1a;--s1:#3987e5;--s2:#d95926;--mid:#383835;--pole-a:#5598e7;--pole-b:#e66767;--seq-lo:#1d2a3a;--seq-hi:#9ec5f4}}*{box-sizing:border-box}body{background:var(--page);color:var(--ink);margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1080px;margin:0 auto;padding:28px 16px 80px}h1{letter-spacing:.02em;margin:0;font-size:26px}h1 i{color:var(--s2);font-style:normal}h2{margin:0 0 2px;font-size:17px}p{color:var(--ink2);margin:6px 0}p.how{max-width:78ch;font-size:13.5px}a{color:inherit}.top{flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px;display:flex}.live{color:var(--ink2);align-items:center;gap:6px;font-size:13px;display:inline-flex}.live:before{content:"";background:var(--muted);border-radius:50%;width:8px;height:8px}.live.on:before{background:var(--good)}.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-top:16px;padding:18px 18px 16px}.hero{flex-wrap:wrap;align-items:flex-end;gap:8px 28px;display:flex}.hero .big{font-size:52px;font-weight:650;line-height:1}.hero .bigl{color:var(--ink2);margin-top:6px;font-size:14px}.tiles{flex-wrap:wrap;gap:8px 28px;margin-left:auto;display:flex}.tile b{font-size:22px;font-weight:650;display:block}.tile span{color:var(--ink2);font-size:12.5px}.btns{flex-wrap:wrap;gap:8px;margin-top:14px;display:flex}button,.btn{font:inherit;border:1px solid var(--border);color:var(--ink);cursor:pointer;background:0 0;border-radius:8px;padding:7px 13px;font-size:13.5px;font-weight:600;text-decoration:none;display:inline-block}button:hover,.btn:hover{background:color-mix(in srgb, var(--ink) 7%, transparent)}button.primary,.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}button.sel{background:color-mix(in srgb, var(--ink) 12%, transparent)}.flags{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-top:12px;display:grid}.flag{border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px}.flag .lv{letter-spacing:.06em;color:var(--ink2);align-items:center;gap:6px;font-size:11.5px;font-weight:700;display:inline-flex}.flag .lv:before{content:"";background:var(--muted);border-radius:2px;width:9px;height:9px}.flag.red .lv:before{background:var(--critical)}.flag.amber .lv:before{background:var(--warning);border-radius:50%}.flag b.t{margin:2px 0;font-size:15px;display:block}.flag p{margin:0;font-size:13px}.legend{color:var(--ink2);flex-wrap:wrap;gap:16px;margin:8px 0 2px;font-size:12.5px;display:flex}.legend i{vertical-align:middle;border-top:2px solid;width:14px;height:0;margin-right:6px;display:inline-block}.legend i.box{border:0;border-radius:2px;height:10px}svg{width:100%;height:auto;display:block;overflow:visible}svg text{fill:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px}svg text.lbl{fill:var(--ink2)}.scrollx{overflow-x:auto}#tip{pointer-events:none;background:var(--surface);border:1px solid var(--border);z-index:10;border-radius:8px;max-width:300px;padding:8px 10px;font-size:12.5px;display:none;position:fixed;box-shadow:0 6px 24px #0000002e}#tip b{font-size:14px}#tip .r{color:var(--ink2);justify-content:space-between;gap:8px;display:flex}#tip .r b{color:var(--ink);font-size:12.5px}#tip .r i{vertical-align:middle;border-top:2px solid;width:12px;margin-right:5px;display:inline-block}.eras{gap:10px;margin-top:12px;display:grid}.era{border:1px solid var(--border);border-radius:10px;padding:12px 14px}.era .hd{flex-wrap:wrap;align-items:baseline;gap:4px 14px;display:flex}.era .hd b{font-size:15.5px}.era .hd span{color:var(--ink2);font-variant-numeric:tabular-nums;font-size:12.5px}.era .crown{letter-spacing:.06em;border:1px solid var(--border);border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700}.era p{margin:6px 0 0;font-size:13.5px}.era .btns{margin-top:8px}.era .btns .btn{padding:4px 10px;font-size:12.5px}.cols{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px 28px;margin-top:8px;display:grid}.bars h3{color:var(--ink2);margin:8px 0 6px;font-size:13px;font-weight:600}.bar{grid-template-columns:128px 1fr 44px;align-items:center;gap:8px;height:22px;font-size:12.5px;display:grid}.bar .nm{color:var(--ink2);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.bar .tr{height:12px}.bar .fl{background:var(--s1);border-radius:0 4px 4px 0;min-width:2px;height:12px}.bar .v{text-align:right;font-variant-numeric:tabular-nums}table{border-collapse:collapse;width:100%;margin-top:8px;font-size:13px}th,td{text-align:right;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;padding:5px 8px}th{color:var(--ink2);font-weight:600}th:first-child,td:first-child{text-align:left}details{color:var(--ink2);margin-top:10px;font-size:13.5px}details summary{cursor:pointer;color:var(--ink);font-weight:600}.empty{text-align:center;padding:60px 16px}code{background:color-mix(in srgb, var(--ink) 8%, transparent);border-radius:4px;padding:1px 5px;font-size:13px}</style>
